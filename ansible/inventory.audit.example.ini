# Angelina Hybrid Cloud — SECURITY AUDIT inventory TEMPLATE.
# ---------------------------------------------------------------------------
# Copy this to inventory.audit.ini (which is git-ignored) and fill in the real
# host addresses / credentials. The audit playbook is READ-ONLY and safe to run
# against BOTH the live production (local) VM and the cloud VM.
#
#   cp inventory.audit.example.ini inventory.audit.ini
#   # edit inventory.audit.ini -> set real IPs / creds
#   ansible-playbook -i inventory.audit.ini audit.yml
#
# The two hosts differ in access + expected posture, so each host sets a
# `deployment` var (local|cloud) that the role uses to apply context-aware
# risk rules (e.g. cloud 8080 must be 127.0.0.1; local 8080 on 0.0.0.0 is OK).
# ---------------------------------------------------------------------------

[angelina_hosts]
# LOCAL production Angelina VM (RHEL 10.2). Reached over the LAN with password
# auth; sudo requires the become password. Binds 8080 on 0.0.0.0 for LAN by
# design (that is expected, not a risk).
angelina-local ansible_host=YOUR_LOCAL_VM_IP deployment=local ansible_user=angelina ansible_password=YOUR_LOCAL_PASSWORD ansible_become_password=YOUR_LOCAL_SUDO_PASSWORD

# CLOUD Angelina VM (Rocky 9.8). Reached over SSH key; passwordless sudo. 8080
# MUST be bound to 127.0.0.1 (fronted by Caddy) — public 8080 here is a RISK.
angelina-cloud ansible_host=YOUR_CLOUD_VM_IP deployment=cloud ansible_user=angelina ansible_ssh_private_key_file=~/.ssh/angelina_cloud

[angelina_hosts:vars]
ansible_python_interpreter=/usr/bin/python3
