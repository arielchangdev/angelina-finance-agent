# Angelina Hybrid Cloud — inventory TEMPLATE.
# ---------------------------------------------------------------------------
# Copy this to inventory.ini (which is git-ignored) and fill in the real,
# FRESH cloud VM public IP. Do NOT point this at the running production VM;
# this playbook is designed to provision a brand-new e2-micro from scratch.
#
#   cp inventory.example.ini inventory.ini
#   # edit inventory.ini -> set the real host under [cloud]
#
# The playbook connects as the 'angelina' user over SSH key auth. Make sure the
# operator public key is installed on the VM BEFORE the ssh_hardening role
# disables password auth (see README.md).
# ---------------------------------------------------------------------------

[cloud]
# Replace the placeholder with the fresh VM's public IP or DNS name.
angelina-cloud ansible_host=REPLACE_WITH_FRESH_VM_IP

[cloud:vars]
ansible_user=angelina
ansible_ssh_private_key_file=~/.ssh/angelina_cloud
ansible_python_interpreter=/usr/bin/python3
