[defaults]
# Angelina Hybrid Cloud — Ansible controller config.
# Point at the operator's real inventory (copy inventory.example.ini -> inventory.ini).
inventory = ./inventory.ini
roles_path = ./roles
remote_user = angelina
# The prod host key isn't pre-seeded on a fresh VM; disable strict checking for
# first contact. Operators who pin known_hosts may re-enable this.
host_key_checking = False
retry_files_enabled = False
# Private key is inventory-driven (ansible_ssh_private_key_file per host/group),
# so it stays out of this committed file. Uncomment to set a global default:
# private_key_file = ~/.ssh/angelina_cloud
interpreter_python = auto_silent
stdout_callback = default

[privilege_escalation]
# App provisioning needs root (dnf, systemd, firewalld, /etc, /opt).
become = True
become_method = sudo

[ssh_connection]
pipelining = True
