# Angelina Hybrid Cloud — OPS workflow inventory TEMPLATE.
# ---------------------------------------------------------------------------
# Used by the two lightweight workflow playbooks (ansible-core only, NO AAP):
#   * ops-heal.yml   — service self-healing (targets group: angelina_hosts)
#   * cert-check.yml — proactive TLS-expiry check (targets group: cloud_hosts)
#
# Copy this to inventory.ops.ini (which is git-ignored) and fill in the real
# host addresses / credentials + the public cert domain:
#
#   cp inventory.ops.example.ini inventory.ops.ini
#   # edit inventory.ops.ini -> set real IPs / creds / cert_domain
#   ansible-playbook --syntax-check -i inventory.ops.example.ini ops-heal.yml
#   ansible-playbook -i inventory.ops.ini ops-heal.yml -e heal_enabled=false
#   ansible-playbook -i inventory.ops.ini cert-check.yml -e cert_notify=false
#
# Telegram creds (telegram_bot_token / telegram_chat_id) and (optionally)
# cert_domain live in the git-ignored vault: group_vars/all/vault.yml
# (template: group_vars/all/vault.example.yml). Do NOT put secrets here.
# ---------------------------------------------------------------------------

[angelina_hosts]
# LOCAL production Angelina VM (RHEL 10.2). LAN password auth; sudo needs the
# become password (required for the gated systemctl restart in ops-heal).
angelina-local ansible_host=YOUR_LOCAL_VM_IP deployment=local ansible_user=angelina ansible_password=YOUR_LOCAL_PASSWORD ansible_become_password=YOUR_LOCAL_SUDO_PASSWORD

# CLOUD Angelina VM (Rocky 9.8). SSH key; passwordless sudo.
angelina-cloud ansible_host=YOUR_CLOUD_VM_IP deployment=cloud ansible_user=angelina ansible_ssh_private_key_file=~/.ssh/angelina_cloud

# cert-check.yml targets ONLY the cloud host (it serves the public HTTPS cert).
[cloud_hosts]
angelina-cloud

[angelina_hosts:vars]
ansible_python_interpreter=/usr/bin/python3

# The public FQDN whose Let's Encrypt cert cert-check.yml probes. Kept out of
# committed files — override here in the real inventory.ops.ini, in the vault,
# or via -e cert_domain=... The placeholder must be replaced to run for real.
[cloud_hosts:vars]
cert_domain=YOUR_CERT_DOMAIN
