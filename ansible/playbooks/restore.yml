---
# Restore Playbook - Restore from backup on agent VMs
- name: Restore from backup on all agent VMs
  hosts: agents
  gather_facts: false

  vars:
    backup_path: "latest"

  tasks:
    - name: Restore from backup
      block:
        - name: Run restore script
          ansible.builtin.shell: bash {{ app_dir }}/deploy/restore.sh {{ backup_path }}
          register: restore_result
          changed_when: true

        - name: Print restore output
          ansible.builtin.debug:
            msg: |
              ===== RESTORE OUTPUT for {{ inventory_hostname }} =====
              {{ restore_result.stdout }}
              ================================================

        - name: Wait for service to start
          ansible.builtin.pause:
            seconds: 10

        - name: Verify health after restore
          ansible.builtin.uri:
            url: "http://localhost:8080/health"
            method: GET
            timeout: 30
          register: health_check
          retries: 5
          delay: 5
          until: health_check.status == 200

        - name: Report restore success
          ansible.builtin.debug:
            msg: |
              ===== RESTORE RESULT for {{ inventory_hostname }} =====
              Status: SUCCESS
              Backup used: {{ backup_path }}
              Health check: PASSED
              ================================================

      rescue:
        - name: Report restore failure
          ansible.builtin.debug:
            msg: |
              ===== RESTORE RESULT for {{ inventory_hostname }} =====
              Status: FAILED
              Backup path: {{ backup_path }}
              Error: {{ ansible_failed_result.msg | default('Unknown error') }}
              Stderr: {{ restore_result.stderr | default('N/A') }}
              ================================================